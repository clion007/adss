# See /LICENSE for more information.

name: 镜像同步

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
  repository_dispatch:
    types: []
  push:
  delete:
  create:

jobs:
  sync:
    name: 镜像同步
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:

      - name: Set TimeZone
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timedatectl set-timezone "$TZ"

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs -y
          git lfs install

      - name: Mirrors Synchronized (migrate to LFS)
        env:
          SOURCE_REPO: 'https://github.com/clion007/adss.git'
          DESTINATION_REPO: 'https://clion:${{ secrets.GITCODE_TOKEN2 }}@gitcode.com/clion/adss.git'
        run: |
          git clone --depth 1 "$SOURCE_REPO" adss-mirror
          cd adss-mirror
          # 删除工作区中的大文件（如果有）
          rm -f rules/file/dnsrules.conf rules/file/hostsrules.conf
          git add -A
          git commit -m "Remove dnsrules.conf" --allow-empty
          git remote set-url --push origin "$DESTINATION_REPO"
          git push --force origin master
      
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: 0
          keep_minimum_runs: 2