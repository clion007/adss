# Description: ADSS mirrors synchronized using GitHub Actions
#
# This is free software, licensed under the GPL v3 License.
# See /LICENSE for more information.

name: 镜像同步

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
  repository_dispatch:
    types: [rules_updated]
  push:
  delete:
  create:

jobs:
  sync:
    name: 镜像同步
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:

      - name: Set TimeZone
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timedatectl set-timezone "$TZ"

      - name: Install git-filter-repo
        run: |
          sudo apt-get update
          sudo apt-get install git-filter-repo -y

      - name: Mirrors Synchronized
        env:
          SOURCE_REPO: 'https://github.com/clion007/adss.git'
          DESTINATION_REPO: 'https://clion:${{ secrets.GITCODE_TOKEN2 }}@gitcode.com/clion/adss.git'
        run: |
          git clone --mirror "$SOURCE_REPO" adss-mirror
          cd adss-mirror

          # 删除所有历史中的 dnsrules.conf 和 hostsrules.conf（无论路径）
          git filter-repo --path dnsrules.conf --invert-paths --force
          git filter-repo --path hostsrules.conf --invert-paths --force

          # 设置目标远程
          git remote set-url --push origin "$DESTINATION_REPO"

          # 强制推送（覆盖目标仓库的所有引用）
          git push --mirror --force
      
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: 0
          keep_minimum_runs: 2
